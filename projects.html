<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>企画 — Aoristos｜SF 2026</title>
  <meta name="description" content="Aoristos の大阪星光学院 SF 2026 出展企画の一覧。キーワード検索と分類での絞り込みができます。">
  <meta name="author" content="Aoristos">
  <meta name="theme-color" content="#f5f5f7">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="stylesheet" href="assets/style.css">
  <script>
    window.pageConfig = { currentPage: 'projects', basePath: '' };
  </script>
  <script src="assets/config.js"></script>
  <script src="assets/sheet.js" defer></script>
  <script src="assets/header.js" defer></script>
  <script src="assets/script.js" defer></script>
</head>
<body>

<main id="main" class="band-alt">
  <header class="page-hero">
    <div class="container">
      <h1 class="page-title">企画</h1>
      <p class="page-lead">展示、体験、販売。Aoristos の企画と、あわせて楽しめる電気工学部などの企画をまとめました。</p>
    </div>
  </header>

  <section class="container" style="padding-bottom:100px" aria-label="企画一覧">
    <div class="toolbar">
      <label class="search">
        <span class="skip-link">企画を検索</span>
        <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="6"/><path d="m13 13 5 5"/></svg>
        <input id="projectsSearch" type="search" placeholder="企画名・キーワードで検索" autocomplete="off">
      </label>
      <div class="toolbar-meta">
        <span id="projectsCount" aria-live="polite"></span>
        <button type="button" class="text-btn" id="toggleAll" aria-pressed="true">説明をすべて閉じる</button>
      </div>
    </div>

    <div class="chips" id="filterList" role="group" aria-label="分類で絞り込む"></div>

    <div class="projects-grid" id="projectsGrid">
      <p class="empty">読み込み中…</p>
    </div>
    <p class="empty" id="projectsNoResults" hidden>条件に合う企画が見つかりませんでした。</p>
  </section>
</main>

</body>
</html>
